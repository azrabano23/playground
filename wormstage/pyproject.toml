[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wormstage"
version = "0.1.0"
description = "Compile the C. elegans connectome at every developmental stage into a snake-robot controller, and ask whether the robot's gait develops like the worm's."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "loopgraph"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wormstage = "wormstage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wormstage = ["data/*.json.gz"]
