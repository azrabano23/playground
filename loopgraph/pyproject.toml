[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgraph"
version = "0.1.0"
description = "A research harness: content-addressed experiment graphs, verification gates, an append-only ledger, and pluggable agents that decide what to run next."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
test = ["pytest>=7"]

[project.scripts]
loopgraph = "loopgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
